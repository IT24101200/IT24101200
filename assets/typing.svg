<svg xmlns="http://www.w3.org/2000/svg" width="900" height="72" viewBox="0 0 900 72" role="img" aria-labelledby="title desc">
<title id="title">What I build</title>
<desc id="desc">Rotating headline: AI and Machine Learning Enthusiast, Full-Stack and Mobile Developer, Building Practical AI Solutions, Learn Build Improve Repeat.</desc>
<defs>
 <linearGradient id="border" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22D3EE"/><stop offset=".5" stop-color="#8B5CF6"/><stop offset="1" stop-color="#F472B6"/></linearGradient>
 <style>
 .msg{fill:#F8FAFC;font:600 23px Arial,Helvetica,sans-serif;opacity:0}
 .first{opacity:1;animation:one 16s linear infinite}
 .second{animation:two 16s linear infinite}
 .third{animation:three 16s linear infinite}
 .fourth{animation:four 16s linear infinite}
 .dot{animation:pulse 2s ease-in-out infinite}
 @keyframes one{0%,22%{opacity:1}25%,100%{opacity:0}}
 @keyframes two{0%,24%{opacity:0}26%,47%{opacity:1}50%,100%{opacity:0}}
 @keyframes three{0%,49%{opacity:0}51%,72%{opacity:1}75%,100%{opacity:0}}
 @keyframes four{0%,74%{opacity:0}76%,97%{opacity:1}100%{opacity:0}}
 @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
 @media(prefers-reduced-motion:reduce){.msg,.dot{animation:none}.msg{opacity:0}.first{opacity:1}}
 </style>
</defs>
<rect x="1.5" y="1.5" width="897" height="69" rx="16" fill="#0E1830" stroke="url(#border)" stroke-width="2"/>
<circle class="dot" cx="39" cy="36" r="5" fill="#22D3EE"/>
<circle cx="862" cy="36" r="5" fill="#F472B6" opacity=".75"/>
<text class="msg first" x="450" y="44" text-anchor="middle">AI &amp; Machine Learning Enthusiast</text>
<text class="msg second" x="450" y="44" text-anchor="middle">Full-Stack &amp; Mobile Developer</text>
<text class="msg third" x="450" y="44" text-anchor="middle">Building Practical AI Solutions</text>
<text class="msg fourth" x="450" y="44" text-anchor="middle">Learn. Build. Improve. Repeat.</text>
</svg>
