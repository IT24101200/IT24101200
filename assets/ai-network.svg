<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="274" viewBox="0 0 1020 274" role="img" aria-labelledby="title desc">
  <title id="title">From data to intelligent applications</title>
  <desc id="desc">Animated data flows from datasets, through a machine learning neural network, to web, mobile and AI applications.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08172C"/><stop offset="0.54" stop-color="#111B38"/><stop offset="1" stop-color="#1A1233"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22D3EE"/><stop offset="0.55" stop-color="#A78BFA"/><stop offset="1" stop-color="#F472B6"/></linearGradient>
    <radialGradient id="core"><stop stop-color="#A78BFA" stop-opacity=".36"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="#B8C4E9" opacity=".13"/></pattern>
    <style>
      .edge{fill:none;stroke:url(#edge);stroke-width:1.5;opacity:.40}
      .active{fill:none;stroke:#67E8F9;stroke-width:2.2;stroke-dasharray:7 14;animation:flow 3.8s linear infinite;opacity:.88}
      .node{fill:#1D2750;stroke:#A5B4FC;stroke-width:1.5;animation:pulse 3s ease-in-out infinite}
      .node:nth-of-type(2n){animation-delay:.9s}
      .node:nth-of-type(3n){animation-delay:1.6s}
      .spark{fill:#67E8F9;animation:blink 2.7s ease-in-out infinite}
      .spark2{fill:#F9A8D4;animation:blink 3.4s ease-in-out infinite .6s}
      .label{font:700 16px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#EDF2FF;letter-spacing:1.4px}
      .detail{font:500 12px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#A9B7DC;letter-spacing:1.2px}
      .headline{font:700 16px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#B4A2FF;letter-spacing:2px}
      @keyframes flow{to{stroke-dashoffset:-84}}
      @keyframes pulse{0%,100%{stroke-opacity:.65;fill:#1D2750}50%{stroke-opacity:1;fill:#31356A}}
      @keyframes blink{0%,100%{opacity:.35}50%{opacity:1}}
      @media(prefers-reduced-motion:reduce){.edge,.active,.node,.spark,.spark2{animation:none}}
    </style>
  </defs>
  <rect x="0.75" y="0.75" width="1018.5" height="272.5" rx="22" fill="url(#background)" stroke="#43547E" stroke-width="1.5"/>
  <rect x="2" y="2" width="1016" height="270" rx="21" fill="url(#dots)"/>
  <text class="headline" x="510" y="37" text-anchor="middle">FROM DATA TO REAL-WORLD AI</text>
  <path d="M305 58 H715" stroke="#53628D" opacity=".6"/>
  <circle cx="510" cy="58" r="3" fill="#22D3EE"/>
  <!-- Inputs -->
  <rect x="69" y="99" width="166" height="104" rx="16" fill="#122B42" stroke="#22D3EE" stroke-opacity=".65"/>
  <g stroke="#67E8F9" stroke-width="1.6" fill="none" opacity=".8">
    <path d="M100 128h24v16h-24z M100 144h24v16h-24z M100 160h24v16h-24z"/>
    <path d="M105 132h15 M105 148h15 M105 164h15"/>
  </g>
  <text x="171" y="147" class="label" text-anchor="middle">DATA</text>
  <text x="171" y="168" class="detail" text-anchor="middle">INPUTS</text>
  <circle cx="91" cy="114" r="3" class="spark"/>
  <!-- ML network edges -->
  <circle cx="509" cy="157" r="128" fill="url(#core)"/>
  <g class="edge">
    <path d="M377 103 L470 85 L563 103 L641 135"/>
    <path d="M377 103 L470 139 L563 103 L641 173"/>
    <path d="M377 103 L470 193 L563 157 L641 135"/>
    <path d="M377 157 L470 85 L563 157 L641 173"/>
    <path d="M377 157 L470 139 L563 211 L641 135"/>
    <path d="M377 157 L470 193 L563 103 L641 173"/>
    <path d="M377 211 L470 85 L563 211 L641 173"/>
    <path d="M377 211 L470 139 L563 157 L641 135"/>
    <path d="M377 211 L470 193 L563 211 L641 173"/>
    <path d="M470 85 L563 211 M470 193 L563 103"/>
  </g>
  <!-- Animated flow into and out of model -->
  <path d="M235 151 C283 151 324 157 377 157" class="edge" stroke-width="3"/>
  <path d="M235 151 C283 151 324 157 377 157" class="active"/>
  <path d="M641 157 C693 157 733 151 776 151" class="edge" stroke-width="3"/>
  <path d="M641 157 C693 157 733 151 776 151" class="active"/>
  <!-- model nodes -->
  <g>
    <circle class="node" cx="377" cy="103" r="10"/><circle class="node" cx="377" cy="157" r="10"/><circle class="node" cx="377" cy="211" r="10"/>
    <circle class="node" cx="470" cy="85" r="11"/><circle class="node" cx="470" cy="139" r="11"/><circle class="node" cx="470" cy="193" r="11"/>
    <circle class="node" cx="563" cy="103" r="11"/><circle class="node" cx="563" cy="157" r="11"/><circle class="node" cx="563" cy="211" r="11"/>
    <circle class="node" cx="641" cy="135" r="10"/><circle class="node" cx="641" cy="173" r="10"/>
  </g>
  <circle cx="500" cy="76" r="3" class="spark2"/>
  <circle cx="595" cy="220" r="3" class="spark"/>
  <text x="511" y="242" text-anchor="middle" class="detail">LEARN • PREDICT • IMPROVE</text>
  <!-- Output -->
  <rect x="777" y="99" width="175" height="104" rx="16" fill="#30203F" stroke="#F472B6" stroke-opacity=".75"/>
  <g fill="none" stroke="#F9A8D4" stroke-width="2">
    <rect x="794" y="122" width="42" height="28" rx="3"/><path d="M815 150v8 m-12 0h24"/>
    <rect x="803" y="162" width="24" height="7" rx="3"/>
  </g>
  <text x="889" y="147" class="label" text-anchor="middle">SMART</text>
  <text x="889" y="169" class="detail" text-anchor="middle">APPLICATIONS</text>
  <circle cx="936" cy="114" r="3" class="spark2"/>
  <text x="152" y="224" text-anchor="middle" class="detail">COLLECT &amp; PREPARE</text>
  <text x="865" y="224" text-anchor="middle" class="detail">BUILD &amp; DELIVER</text>
</svg>
